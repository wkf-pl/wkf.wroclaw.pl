name: wkf-online

services:
  app:
    build:
      context: .
      target: development
    command: ./scripts/start-development-container.sh
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      mailpit:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      AZURE_STORAGE_ALLOW_CONTAINER_CREATE: 'true'
      AZURE_STORAGE_ACCOUNT_BASE_URL: http://127.0.0.1:10000/devstoreaccount1
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONTAINER_NAME: media
      COMPOSE_APP_URL: http://127.0.0.1:3000
      COMPOSE_MAILPIT_URL: http://mailpit:8025
      DATABASE_URL: postgresql://${POSTGRES_USER:-wkf}:${POSTGRES_PASSWORD:-wkf}@postgres:5432/${POSTGRES_DB:-wkf}
      SERVER_URL: http://127.0.0.1:3000
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      NODE_ENV: development
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - app_next:/app/.next-container
      - app_node_modules:/app/node_modules

  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wkf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wkf}
      POSTGRES_USER: ${POSTGRES_USER:-wkf}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: wkf_test
      POSTGRES_PASSWORD: wkf
      POSTGRES_USER: wkf
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: >-
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --disableTelemetry
      --skipApiVersionCheck
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
    volumes:
      - azurite_data:/data

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - mailpit_data:/data

volumes:
  app_node_modules:
  app_next:
  azurite_data:
  mailpit_data:
  postgres_data:
  postgres_test_data:
