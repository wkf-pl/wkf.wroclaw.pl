name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_ACCOUNT_BASE_URL: http://127.0.0.1:10000/devstoreaccount1
      AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      AZURE_STORAGE_CONTAINER_NAME: media
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      PAYLOAD_SECRET: build-time-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Run static checks and unit tests
        run: pnpm check

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
        uses: docker/setup-buildx-action@v4

      - name: Validate production container image
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=wkf-online
          cache-to: type=gha,mode=max,scope=wkf-online
          context: .
          push: false
          tags: wkf-online:ci

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: verify
    permissions:
      actions: write
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/deploy-staging.yml
