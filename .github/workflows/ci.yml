name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZURE_STORAGE_ACCOUNT_BASE_URL: http://127.0.0.1:10000/devstoreaccount1
  AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
  AZURE_STORAGE_CONTAINER_NAME: media
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
  PAYLOAD_SECRET: build-time-only

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Check formatting
        run: pnpm format:check

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Generate Payload import map
        run: pnpm generate:importmap

      - name: Verify generated Payload artifacts
        run: >-
          git diff --exit-code --
          src/payload-types.ts
          'src/app/(payload)/admin/importMap.js'

      - name: Run static checks and unit tests
        run: pnpm check

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Run integration tests
        run: pnpm test:integration

  end-to-end:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/4
        run: pnpm test:e2e:ci

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            /tmp/wkf-online-playwright-results
            /tmp/wkf-online-playwright-report
          retention-days: 7

  validate-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate production container image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=wkf-online
          cache-to: type=gha,mode=max,scope=wkf-online
          context: .
          push: false
          tags: wkf-online:ci
