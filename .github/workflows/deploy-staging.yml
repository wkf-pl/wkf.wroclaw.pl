name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - master
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: westeurope
  AZURE_RESOURCE_PREFIX: wkf

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      STAGING_ENTRA_ALLOWED_GROUP_ID: ${{ vars.ENTRA_ALLOWED_GROUP_ID }}
      STAGING_ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      STAGING_ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      STAGING_ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Reconcile shared Azure resources
        id: shared
        run: |
          registry_name="$(az deployment sub create \
            --name wkf-shared \
            --location "$AZURE_LOCATION" \
            --template-file infra/azure/shared.bicep \
            --parameters location="$AZURE_LOCATION" resourcePrefix="$AZURE_RESOURCE_PREFIX" \
            --query properties.outputs.registryName.value \
            --output tsv)"
          echo "registry_name=$registry_name" >> "$GITHUB_OUTPUT"

      - name: Build immutable application image
        id: image
        env:
          REGISTRY_NAME: ${{ steps.shared.outputs.registry_name }}
        run: |
          repository="wkf-online"
          tag="$SOURCE_SHA"
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "${repository}:${tag}" \
            .
          digest="$(az acr repository show \
            --name "$REGISTRY_NAME" \
            --image "${repository}:${tag}" \
            --query digest \
            --output tsv)"
          login_server="$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)"
          image_reference="${login_server}/${repository}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Migrate and deploy staging
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
        run: bash scripts/deploy-azure.sh staging "$IMAGE_REFERENCE"

      - name: Publish promotion details
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Staging deployment"
            echo
            echo "Image digest for production promotion: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
