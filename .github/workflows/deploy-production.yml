name: Operate production

on:
  workflow_dispatch:
    inputs:
      phase:
        description: First launch phase or a later deployment
        options:
          - provision
          - bootstrap
          - deploy
        required: true
        type: choice
      image_digest:
        description: Application digest verified on staging, including the sha256 prefix
        required: true
        type: string
      operations_image_digest:
        description: Operations image digest reported by the same staging deployment
        required: true
        type: string
      source_sha:
        description: Full source commit reported by the staging deployment
        required: true
        type: string
      run_migrations:
        default: true
        description: Run migrations before starting the application in the deploy phase
        type: boolean

concurrency:
  group: production-operations
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: polandcentral
  AZURE_RESOURCE_PREFIX: wkf

jobs:
  production:
    runs-on: ubuntu-latest
    environment: prod
    env:
      CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE_ID }}
      ENTRA_ALLOWED_GROUP_ID: ${{ vars.ENTRA_ALLOWED_GROUP_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      POSTGRES_MIGRATOR_PASSWORD: ${{ secrets.POSTGRES_MIGRATOR_PASSWORD }}
      POSTGRES_RUNTIME_PASSWORD: ${{ secrets.POSTGRES_RUNTIME_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Validate promotion provenance
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          OPERATIONS_IMAGE_DIGEST: ${{ inputs.operations_image_digest }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/master' ]]; then
            echo 'Production operations may only be dispatched from master.' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'image_digest must be a sha256 digest.' >&2
            exit 1
          fi
          if [[ ! "$OPERATIONS_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'operations_image_digest must be a sha256 digest.' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'source_sha must be a full Git commit SHA.' >&2
            exit 1
          fi

          git fetch --no-tags origin master
          master_sha="$(git rev-parse origin/master)"
          if [[ "$SOURCE_SHA" != "$master_sha" ]]; then
            echo "The promoted source SHA must equal current master ($master_sha)." >&2
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Resolve promoted images
        id: images
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          OPERATIONS_IMAGE_DIGEST: ${{ inputs.operations_image_digest }}
        run: |
          registry_name="$(az acr list --resource-group "rg-${AZURE_RESOURCE_PREFIX}-shared" --query '[0].name' --output tsv)"
          if [[ -z "$registry_name" ]]; then
            echo 'Could not resolve the shared Azure Container Registry.' >&2
            exit 1
          fi

          az acr repository show --name "$registry_name" --image "wkf-online@${IMAGE_DIGEST}" --output none
          az acr repository show --name "$registry_name" --image "wkf-operations@${OPERATIONS_IMAGE_DIGEST}" --output none
          login_server="$(az acr show --name "$registry_name" --query loginServer --output tsv)"

          {
            echo "application=${login_server}/wkf-online@${IMAGE_DIGEST}"
            echo "operations=${login_server}/wkf-operations@${OPERATIONS_IMAGE_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Preview infrastructure changes
        if: inputs.phase == 'provision'
        env:
          IMAGE_REFERENCE: ${{ steps.images.outputs.application }}
        run: |
          az deployment group what-if \
            --name wkf-prod-infrastructure-preview \
            --resource-group "rg-${AZURE_RESOURCE_PREFIX}-prod" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/environments/prod.bicepparam \
            --parameters deployApplication=false location="$AZURE_LOCATION" resourcePrefix="$AZURE_RESOURCE_PREFIX" sourceSha="$SOURCE_SHA" \
            --result-format ResourceIdOnly

      - name: Provision production without the application
        if: inputs.phase == 'provision'
        env:
          IMAGE_REFERENCE: ${{ steps.images.outputs.application }}
        run: bash scripts/deploy-azure.sh prod "$IMAGE_REFERENCE" --provision-only

      - name: Bootstrap least-privilege PostgreSQL roles
        if: inputs.phase == 'bootstrap'
        run: bash scripts/run-production-database-operation.sh bootstrap "${{ steps.images.outputs.operations }}"

      - name: Migrate and deploy the application
        if: inputs.phase == 'deploy'
        env:
          IMAGE_REFERENCE: ${{ steps.images.outputs.application }}
          OPERATIONS_IMAGE_REFERENCE: ${{ steps.images.outputs.operations }}
        run: |
          deployment_options=()
          if [[ "${{ inputs.run_migrations }}" == 'true' ]]; then
            deployment_options+=(--maintenance)
          fi
          bash scripts/deploy-azure.sh prod "$IMAGE_REFERENCE" "${deployment_options[@]}"

      - name: Publish operation details
        env:
          APPLICATION_IMAGE: ${{ steps.images.outputs.application }}
          OPERATIONS_IMAGE: ${{ steps.images.outputs.operations }}
        run: |
          {
            echo '## Production operation'
            echo
            echo "Phase: \`${{ inputs.phase }}\`"
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Application image: \`$APPLICATION_IMAGE\`"
            echo "Operations image: \`$OPERATIONS_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
