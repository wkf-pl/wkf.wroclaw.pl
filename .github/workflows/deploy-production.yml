name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Digest verified on staging, including the sha256 prefix
        required: true
        type: string
      source_sha:
        description: Full source commit reported by the staging deployment
        required: true
        type: string
      provision_infrastructure:
        description: Reconcile all Azure infrastructure before deploying
        options:
          - auto
          - 'true'
          - 'false'
        default: auto
        type: choice
      run_migrations:
        description: Enter maintenance mode and run database migrations
        options:
          - auto
          - 'true'
          - 'false'
        default: auto
        type: choice

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: polandcentral
  AZURE_RESOURCE_PREFIX: wkf

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE_ID }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      PROVISION_INFRASTRUCTURE_OVERRIDE: ${{ inputs.provision_infrastructure }}
      RUN_MIGRATIONS_OVERRIDE: ${{ inputs.run_migrations }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate image digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image_digest must be a sha256 digest." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "source_sha must be a full Git commit SHA." >&2
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Resolve promoted image
        id: image
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          repository="wkf-online"
          registry_name="$(az acr list \
            --resource-group "rg-${AZURE_RESOURCE_PREFIX}-shared" \
            --query '[0].name' \
            --output tsv)"

          if [[ -z "$registry_name" ]]; then
            echo "Could not resolve the shared Azure Container Registry." >&2
            exit 1
          fi

          az acr repository show \
            --name "$registry_name" \
            --image "${repository}@${IMAGE_DIGEST}" \
            --output none
          login_server="$(az acr show --name "$registry_name" --query loginServer --output tsv)"

          git fetch --no-tags origin "$SOURCE_SHA"

          {
            echo "image_reference=${login_server}/${repository}@${IMAGE_DIGEST}"
            echo "registry_name=$registry_name"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Determine deployment plan
        id: plan
        env:
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          application_name="${AZURE_RESOURCE_PREFIX}-prod"
          resource_group_name="rg-${AZURE_RESOURCE_PREFIX}-prod"
          deployed_source_sha=""

          active_revision="$(az containerapp revision list \
            --name "$application_name" \
            --resource-group "$resource_group_name" \
            --query 'sort_by([?properties.active], &properties.createdTime)[-1].name' \
            --output tsv 2>/dev/null || true)"

          if [[ -n "$active_revision" ]]; then
            deployed_source_sha="$(az containerapp revision show \
              --name "$application_name" \
              --resource-group "$resource_group_name" \
              --revision "$active_revision" \
              --query "properties.template.containers[0].env[?name=='DEPLOYED_SOURCE_SHA'] | [0].value" \
              --output tsv 2>/dev/null || true)"
          fi

          plan_file="$(mktemp)"
          bash scripts/classify-deployment.sh "$deployed_source_sha" "$SOURCE_SHA" "$plan_file"
          source "$plan_file"

          resolve_override() {
            local automatic_value="$1"
            local override_value="$2"

            case "$override_value" in
              auto | '') printf '%s' "$automatic_value" ;;
              true | false) printf '%s' "$override_value" ;;
              *) echo "Unsupported deployment override: $override_value" >&2; return 1 ;;
            esac
          }

          provision_infrastructure="$(resolve_override "$provision_infrastructure" "$PROVISION_INFRASTRUCTURE_OVERRIDE")"
          run_migrations="$(resolve_override "$run_migrations" "$RUN_MIGRATIONS_OVERRIDE")"

          if [[ -z "$active_revision" ]]; then
            provision_infrastructure=true
            run_migrations=true
          fi

          {
            echo "provision_infrastructure=$provision_infrastructure"
            echo "run_migrations=$run_migrations"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile shared Azure resources
        if: steps.plan.outputs.provision_infrastructure == 'true'
        run: |
          az deployment group create \
            --name wkf-shared \
            --resource-group "rg-${AZURE_RESOURCE_PREFIX}-shared" \
            --template-file infra/azure/shared.bicep \
            --parameters location="$AZURE_LOCATION" resourcePrefix="$AZURE_RESOURCE_PREFIX" \
            --output none

      - name: Deploy production
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          deployment_options=()
          if [[ "${{ steps.plan.outputs.provision_infrastructure }}" == "true" ]]; then
            deployment_options+=(--provision)
          fi
          if [[ "${{ steps.plan.outputs.run_migrations }}" == "true" ]]; then
            deployment_options+=(--maintenance)
          fi

          bash scripts/deploy-azure.sh prod "$IMAGE_REFERENCE" "${deployment_options[@]}"
